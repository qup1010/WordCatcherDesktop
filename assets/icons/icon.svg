<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bgB3" x1="0.08" y1="0" x2="0.92" y2="1">
      <stop offset="0%" stop-color="#075855"/>
      <stop offset="50%" stop-color="#0D877E"/>
      <stop offset="100%" stop-color="#1EB39D"/>
    </linearGradient>
    <radialGradient id="glowB3" cx="0.22" cy="0.14" r="0.78">
      <stop offset="0%" stop-color="#9DF8E6" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#9DF8E6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rimB3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.30"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.03"/>
    </linearGradient>
    <linearGradient id="wBackB3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#B8EFE6"/>
      <stop offset="100%" stop-color="#8FD9CE"/>
    </linearGradient>
    <linearGradient id="wFrontB3" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#ECFCF9"/>
    </linearGradient>
    <linearGradient id="amberB3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFD76B"/>
      <stop offset="100%" stop-color="#F08B33"/>
    </linearGradient>
    <filter id="wShadowB3" filterUnits="userSpaceOnUse" x="160" y="250" width="704" height="540" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#043331" flood-opacity="0.28"/>
    </filter>
    <filter id="bracketShadowB3" filterUnits="userSpaceOnUse" x="100" y="100" width="824" height="824" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#5E2806" flood-opacity="0.22"/>
    </filter>
  </defs>

  <!-- Fluent Rounded Tile -->
  <rect x="24" y="24" width="976" height="976" rx="244" fill="url(#bgB3)"/>
  <rect x="24" y="24" width="976" height="976" rx="244" fill="url(#glowB3)"/>
  <rect x="26" y="26" width="972" height="972" rx="242" fill="none" stroke="url(#rimB3)" stroke-width="4"/>

  <!-- Concentric Capture Corner Brackets (r=70 matches outer rx=244 - inset=174) -->
  <g filter="url(#bracketShadowB3)" fill="none" stroke="url(#amberB3)" stroke-width="58" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 198 346 L 198 268 A 70 70 0 0 1 268 198 L 346 198"/>
    <path d="M 826 678 L 826 756 A 70 70 0 0 1 756 826 L 678 826"/>
  </g>

  <!-- Sculpted Ribbon 'W': back upward strokes + front downward strokes -->
  <g filter="url(#wShadowB3)" fill="none" stroke-width="82" stroke-linecap="round" stroke-linejoin="round">
    <!-- Upward strokes (subtle mint-white for folded-ribbon depth) -->
    <line x1="392" y1="664" x2="512" y2="418" stroke="url(#wBackB3)"/>
    <line x1="632" y1="664" x2="734" y2="366" stroke="url(#wBackB3)"/>
    <!-- Primary downward strokes (bright pure white) -->
    <line x1="290" y1="366" x2="392" y2="664" stroke="url(#wFrontB3)"/>
    <line x1="512" y1="418" x2="632" y2="664" stroke="url(#wFrontB3)"/>
  </g>
</svg>
