<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Word Catcher · 语境卡片复习与深色外观</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Segoe UI Variable Text", "Segoe UI", "Microsoft YaHei UI", sans-serif;
    color: #162422;
    background: #eff4f2;
  }
  .canvas {
    width: 1440px;
    height: 700px;
    padding: 34px 40px;
    display: flex;
    align-items: flex-start;
    gap: 32px;
    background:
      radial-gradient(840px 540px at 18% 12%, #f8fbfa 0%, rgba(248, 251, 250, 0) 68%),
      radial-gradient(640px 460px at 88% 82%, #e0ebe7 0%, rgba(224, 235, 231, 0) 70%),
      #edf3f0;
  }
  .review-col {
    width: 924px;
    flex-shrink: 0;
  }
  .col-label {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 12px;
  }
  .col-label h2 {
    margin: 0;
    font-size: 19px;
    font-weight: 650;
    color: #152422;
  }
  .col-label span {
    font-size: 13px;
    color: #5b706c;
  }
  .review-frame {
    border-radius: 12px;
    overflow: hidden;
    background: #ffffff;
    box-shadow:
      0 22px 52px rgba(14, 42, 38, 0.13),
      0 4px 14px rgba(14, 42, 38, 0.06),
      0 0 0 1px rgba(18, 45, 42, 0.10);
  }
  .review-frame img {
    display: block;
    width: 100%;
    height: auto;
  }
  .dark-col {
    width: 404px;
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
  }
  .dark-stage {
    height: 595px;
    border-radius: 14px;
    padding: 16px 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(155deg, #1b2221 0%, #242b2a 100%);
    border: 1px solid rgba(255, 255, 255, 0.08);
    box-shadow: 0 22px 52px rgba(10, 22, 20, 0.22);
  }
  .dark-stage img {
    display: block;
    width: 100%;
    height: auto;
  }
</style>
</head>
<body>
<main class="canvas" aria-label="语境卡片复习与深色外观展示">
  <section class="review-col">
    <div class="col-label">
      <h2>语境卡片复习</h2>
      <span>原句自动标记目标词 · Space 翻面 · M 标记「需再练」</span>
    </div>
    <div class="review-frame">
      <img src="raw/review-light.png" alt="语境卡片复习模式">
    </div>
  </section>

  <aside class="dark-col">
    <div class="col-label">
      <h2>深色模式</h2>
      <span>支持浅色、深色与跟随系统</span>
    </div>
    <div class="dark-stage">
      <img src="raw/lookup-dark.png" alt="深色模式查词浮窗">
    </div>
  </aside>
</main>
<script>
  Promise.all(Array.from(document.images).map(i => i.decode()))
    .then(() => document.fonts.ready)
    .then(() => { document.body.dataset.showcaseReady = 'true'; });
</script>
</body>
</html>
