<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Word Catcher · 产品展示</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Segoe UI Variable Text", "Segoe UI", "Microsoft YaHei UI", sans-serif;
    color: #162422;
    background: #eef3f1;
  }
  .poster {
    width: 1600px;
    height: 940px;
    position: relative;
    overflow: hidden;
    background:
      radial-gradient(960px 620px at 14% 8%, #f8fbfa 0%, rgba(248, 251, 250, 0) 68%),
      radial-gradient(760px 560px at 88% 82%, #e2ece8 0%, rgba(226, 236, 232, 0) 70%),
      #edf3f0;
  }
  .header {
    position: absolute;
    top: 40px;
    left: 60px;
    display: flex;
    align-items: center;
    gap: 18px;
  }
  .header img {
    width: 56px;
    height: 56px;
    border-radius: 14px;
    box-shadow: 0 8px 20px rgba(15, 118, 110, 0.16);
  }
  .brand-title {
    margin: 0;
    font-size: 36px;
    font-weight: 650;
    letter-spacing: -0.6px;
    line-height: 1.15;
    color: #142220;
  }
  .brand-sub {
    margin: 4px 0 0;
    font-size: 16px;
    color: #4f6460;
    letter-spacing: 0.2px;
  }
  .library-frame {
    position: absolute;
    left: 60px;
    top: 190px;
    width: 1024px;
    border-radius: 12px;
    overflow: hidden;
    background: #ffffff;
    box-shadow:
      0 28px 64px rgba(14, 42, 38, 0.14),
      0 6px 18px rgba(14, 42, 38, 0.06),
      0 0 0 1px rgba(18, 45, 42, 0.10);
  }
  .library-frame img {
    display: block;
    width: 100%;
    height: auto;
  }
  .context-card {
    position: absolute;
    left: 1126px;
    top: 126px;
    width: 400px;
    padding: 18px 20px 20px;
    border-radius: 12px;
    background: #ffffff;
    box-shadow:
      0 14px 34px rgba(14, 42, 38, 0.09),
      0 0 0 1px rgba(18, 45, 42, 0.08);
  }
  .context-meta {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 24px;
    font-size: 12px;
    color: #6b7d79;
  }
  .context-doc {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-weight: 600;
    color: #3f5551;
  }
  .context-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #0f766e;
  }
  .context-hotkey {
    padding: 2px 7px;
    border-radius: 4px;
    background: #f1f5f4;
    border: 1px solid #dce4e1;
    color: #465b57;
    font-size: 11px;
    font-weight: 600;
  }
  .context-body {
    margin: 0;
    font-family: Georgia, "Times New Roman", serif;
    font-size: 17px;
    line-height: 1.62;
    color: #243331;
    position: relative;
  }
  .sel {
    background: #d5eee9;
    color: #0b5d56;
    padding: 1px 4px;
    border-radius: 4px;
    box-shadow: inset 0 -2px 0 #0f766e;
  }
  .pill-anchor {
    position: relative;
    display: inline-block;
  }
  .pill-float {
    position: absolute;
    right: -28px;
    top: -35px;
    width: 44px;
    height: 44px;
    pointer-events: none;
  }
  .lookup-wrap {
    position: absolute;
    left: 1116px;
    top: 298px;
    width: 420px;
  }
  .lookup-wrap img {
    display: block;
    width: 100%;
    height: auto;
  }
</style>
</head>
<body>
<main class="poster" aria-label="Word Catcher 产品界面展示">
  <header class="header">
    <img src="../../assets/icons/icon.svg" alt="Word Catcher 图标">
    <div>
      <h1 class="brand-title">Word Catcher</h1>
      <p class="brand-sub">随手查词 · 语境详解 · 生词复习</p>
    </div>
  </header>

  <section class="library-frame">
    <img src="raw/library-light.png" alt="Word Catcher 生词库与原句语境管理界面">
  </section>

  <aside class="context-card">
    <div class="context-meta">
      <span class="context-doc"><i class="context-dot"></i>Design Notes.pdf</span>
      <span class="context-hotkey">划词取词 / Ctrl+Shift+Z</span>
    </div>
    <p class="context-body">
      A <span class="pill-anchor"><mark class="sel">resilient</mark><img class="pill-float" src="raw/pill.png" alt="划词浮标"></span> design keeps everyday reading calm even when workflows get busy.
    </p>
  </aside>

  <section class="lookup-wrap">
    <img src="raw/lookup-full.png" alt="Word Catcher 查词浮窗">
  </section>
</main>
<script>
  Promise.all(Array.from(document.images).map(i => i.decode()))
    .then(() => document.fonts.ready)
    .then(() => { document.body.dataset.showcaseReady = 'true'; });
</script>
</body>
</html>
