name: Release Windows app

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore desktop/WordCatcher.Desktop.sln

      - name: Test
        run: dotnet test desktop/WordCatcher.Desktop.sln -c Release --no-restore

      - name: Publish self-contained app
        run: >-
          dotnet publish desktop/src/WordCatcher.App/WordCatcher.App.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=None
          -p:DebugSymbols=false
          -o publish

      - name: Create archive
        shell: pwsh
        run: |
          $archiveName = "WordCatcher-$env:GITHUB_REF_NAME-win-x64.zip"
          Compress-Archive -Path publish\* -DestinationPath $archiveName
          "ARCHIVE_NAME=$archiveName" >> $env:GITHUB_ENV

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$env:GITHUB_REF_NAME" "$env:ARCHIVE_NAME" --generate-notes --title "$env:GITHUB_REF_NAME"
