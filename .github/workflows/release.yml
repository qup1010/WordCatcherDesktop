name: Release Windows app

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore WordCatcher.Desktop.sln

      - name: Test
        run: dotnet test WordCatcher.Desktop.sln -c Release --no-restore

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress --version=6.7.1

      - name: Package Windows installer and portable app
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          ./scripts/Package-Windows.ps1 -Version $version

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $releaseDirectory = 'artifacts/releases'
          $requiredAssets = @('WordCatcherDesktop-win-Setup.exe', 'WordCatcherDesktop-win-Portable.zip')
          foreach ($name in $requiredAssets) {
            if (!(Test-Path -LiteralPath (Join-Path $releaseDirectory $name) -PathType Leaf)) {
              throw "缺少 GitHub Release 必需产物：$name"
            }
          }
          $assets = @($requiredAssets | ForEach-Object { (Resolve-Path (Join-Path $releaseDirectory $_)).Path })
          if ($assets.Count -eq 0) { throw '发布产物为空。' }
          gh release view "$env:GITHUB_REF_NAME" *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload "$env:GITHUB_REF_NAME" @assets --clobber
          } else {
            gh release create "$env:GITHUB_REF_NAME" @assets --verify-tag --notes-file "docs/releases/$env:GITHUB_REF_NAME.md" --title "$env:GITHUB_REF_NAME"
          }
          if ($LASTEXITCODE -ne 0) { throw 'GitHub Release 上传失败。' }

