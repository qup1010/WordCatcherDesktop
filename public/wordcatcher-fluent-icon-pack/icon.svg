<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#075E60"/>
      <stop offset="42%" stop-color="#0D8E88"/>
      <stop offset="100%" stop-color="#27C2AC"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.18" cy="0.12" r="0.85">
      <stop offset="0%" stop-color="#8FF5DF" stop-opacity="0.72"/>
      <stop offset="48%" stop-color="#62DDC9" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#62DDC9" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="backCard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8DEBDE" stop-opacity="0.94"/>
      <stop offset="100%" stop-color="#42B9B1" stop-opacity="0.70"/>
    </linearGradient>
    <linearGradient id="paper" x1="0.12" y1="0.04" x2="0.92" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="62%" stop-color="#F5FFFD"/>
      <stop offset="100%" stop-color="#E0F8F4"/>
    </linearGradient>
    <linearGradient id="letter" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0%" stop-color="#075E60"/>
      <stop offset="100%" stop-color="#0B7F79"/>
    </linearGradient>
    <linearGradient id="marker" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFD36F"/>
      <stop offset="45%" stop-color="#FFB24B"/>
      <stop offset="100%" stop-color="#F48A35"/>
    </linearGradient>
    <linearGradient id="markerGloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFF4C8" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#FFF4C8" stop-opacity="0"/>
    </linearGradient>
    <filter id="baseShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="28" stdDeviation="26" flood-color="#063C3A" flood-opacity="0.28"/>
    </filter>
    <filter id="cardShadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="22" stdDeviation="22" flood-color="#063C3A" flood-opacity="0.25"/>
    </filter>
    <filter id="letterShadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="10" stdDeviation="7" flood-color="#0D5B57" flood-opacity="0.18"/>
    </filter>
    <filter id="markerShadow" x="-30%" y="-40%" width="160%" height="200%">
      <feDropShadow dx="0" dy="14" stdDeviation="12" flood-color="#9D551F" flood-opacity="0.28"/>
    </filter>
    <clipPath id="baseClip">
      <rect x="64" y="64" width="896" height="896" rx="228"/>
    </clipPath>
  </defs>

  <!-- Keep a 24-unit optical margin; avoid an outer shadow shrinking the visible tile. -->
  <g transform="translate(-45.714285714 -45.714285714) scale(1.089285714)">
  <!-- Fluent rounded tile -->
  <g>
    <rect x="64" y="64" width="896" height="896" rx="228" fill="url(#bg)"/>
  </g>

  <!-- soft fluid lighting -->
  <g clip-path="url(#baseClip)">
    <rect x="64" y="64" width="896" height="896" fill="url(#glow)"/>
    <path d="M64,716 C220,624 330,658 440,780 C551,904 716,938 960,842 L960,960 L64,960 Z" fill="#075A67" opacity="0.23"/>
    <path d="M688,64 C812,160 894,266 960,430 L960,64 Z" fill="#95F7E5" opacity="0.10"/>
  </g>

  <!-- rear acrylic layer -->
  <g transform="rotate(5 512 500)" filter="url(#cardShadow)">
    <rect x="250" y="186" width="548" height="654" rx="154" fill="url(#backCard)"/>
    <rect x="272" y="208" width="504" height="610" rx="132" fill="none" stroke="#D7FFF7" stroke-opacity="0.28" stroke-width="6"/>
  </g>

  <!-- front paper / word card -->
  <g transform="rotate(-4 512 500)" filter="url(#cardShadow)">
    <rect x="214" y="160" width="596" height="674" rx="168" fill="url(#paper)"/>
    <path d="M274,205 C390,150 610,146 754,214" fill="none" stroke="#FFFFFF" stroke-opacity="0.70" stroke-width="10" stroke-linecap="round"/>
    <rect x="236" y="182" width="552" height="630" rx="146" fill="none" stroke="#FFFFFF" stroke-opacity="0.58" stroke-width="4"/>
  </g>

  <!-- dictionary glyph -->
  <g transform="rotate(-4 512 500)" filter="url(#letterShadow)">
    <text x="512" y="650"
          text-anchor="middle"
          font-family="Georgia, 'Times New Roman', serif"
          font-size="500"
          font-weight="700"
          fill="url(#letter)">a</text>
  </g>

  <!-- selection / capture marker -->
  <g transform="rotate(-4 512 500)" filter="url(#markerShadow)">
    <rect x="300" y="681" width="430" height="88" rx="44" fill="url(#marker)"/>
    <rect x="318" y="694" width="394" height="26" rx="13" fill="url(#markerGloss)"/>
    <circle cx="314" cy="725" r="16" fill="#FFE498" opacity="0.82"/>
    <circle cx="716" cy="725" r="16" fill="#EA7D2F" opacity="0.38"/>
  </g>

  <!-- tiny fluent specular cue -->
  <circle cx="235" cy="218" r="20" fill="#E7FFF9" opacity="0.50"/>
  </g>
</svg>
